<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>

  <!-- 폰트 CDN: Pretendard (없을 경우 Noto Sans KR로 대체) -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <h1>To-Do List</h1>
    <p class="subtitle">할 일을 똑똑하게 관리하세요</p>
  </header>

  <div class="layout">
    <!-- Sidebar: 할일 추가 폼 -->
    <aside class="sidebar">
      <form id="todo-form" class="todo-form">
        <h2>+ 할일 추가</h2>

        <label for="input-title">제목</label>
        <input type="text" id="input-title" name="title" placeholder="할 일을 입력하세요" required />

        <label for="input-description">설명</label>
        <textarea id="input-description" name="description" rows="2"
                  placeholder="상세 설명 (선택)"></textarea>

        <label for="input-category">카테고리</label>
        <select id="input-category" name="category">
          <option value="work">업무</option>
          <option value="personal">개인</option>
          <option value="study">학습</option>
          <option value="other" selected>기타</option>
        </select>

        <label for="input-priority">우선순위</label>
        <select id="input-priority" name="priority">
          <option value="high">높음</option>
          <option value="medium" selected>중간</option>
          <option value="low">낮음</option>
        </select>

        <label for="input-due-date">마감일</label>
        <input type="date" id="input-due-date" name="due_date" />

        <button type="submit" class="btn-primary">추가</button>
      </form>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- 검색창 (oninput 실시간 검색) -->
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input"
               placeholder="제목·설명으로 검색..." autocomplete="off" />
      </div>

      <!-- 필터 바 -->
      <div class="filter-bar">
        <select id="filter-category">
          <option value="">전체 카테고리</option>
          <option value="work">업무</option>
          <option value="personal">개인</option>
          <option value="study">학습</option>
          <option value="other">기타</option>
        </select>

        <select id="filter-priority">
          <option value="">전체 우선순위</option>
          <option value="high">높음</option>
          <option value="medium">중간</option>
          <option value="low">낮음</option>
        </select>

        <select id="filter-done">
          <option value="">전체 상태</option>
          <option value="false">미완료</option>
          <option value="true">완료</option>
        </select>
      </div>

      <!-- Todo 카드 목록 -->
      <div id="todo-list" class="todo-list">
        <!-- 카드는 JS로 동적 렌더링 -->
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
